project: cinestream_offline
provider: local
registry: data/registry.db
online_store:
  type: redis
  connection_string: localhost:16379,db=1
  # Feast 0.67 so event_timestamp khi ghi Redis. Hai lần publish cùng ngày
  # khác created_timestamp sẽ bị bỏ qua. Thứ tự publication nằm ở materializer.
  skip_dedup: true
offline_store:
  type: duckdb
# Redis db=1 của service local, dành cho feature batch DP4.
# Cửa sổ streaming dùng db=2 và project cinestream_streaming.
# Không trỏ ClickHouse hay serving production.
# get_online_features chỉ có dữ liệu sau materialize. Chưa có KServe.
