[project]
name = "cinestream"
version = "0.1.0"
description = "CineStream synthetic data generator (EDAI K11)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pyarrow>=16.0",
]

[project.optional-dependencies]
kafka = ["kafka-python>=2.0"]
minio = ["boto3>=1.34"]

[project.scripts]
offline-generator = "generator.offline_generator:main"
streaming-producer = "generator.streaming_producer:main"
upload-to-source-minio = "generator.upload_to_source_minio:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["generator", "storage"]
