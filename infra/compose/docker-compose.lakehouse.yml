# UI Layer 2. Không thay cho cụm MinIO/Kafka/Spark ở make up.
services:
  lakehouse-ui:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.lakehouse-ui
    ports:
      - "8088:8088"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
