# ClickHouse phục vụ Gold đã publish. HTTP host :18123, native host :19000.
# Gộp với docker-compose.yml để cùng project cinestream. Không đọc Iceberg.

name: cinestream

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "18123:8123"
      - "19000:9000"
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: cinestream
      CLICKHOUSE_DB: cinestream_serving
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "default", "--password", "cinestream", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
